<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
body{font-family:-apple-system,'Microsoft YaHei',sans-serif;background:#f5f7fa;padding:40px;max-width:800px;margin:0 auto}
h3{font-size:14px;color:#999;margin:30px 0 10px}
.option{background:#fff;border-radius:8px;padding:20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.05)}

/* 方案1：蓝色左边条+加粗大字 */
.h2-v1{font-size:20px;font-weight:800;color:#1a1a2e;padding:4px 0 4px 14px;border-left:4px solid #1976d2;margin:0 0 12px}

/* 方案2：深蓝填充白字 */
.h2-v2{font-size:18px;font-weight:700;color:#fff;background:#1a2a4a;padding:10px 16px;border-radius:6px;margin:0 0 12px}

/* 方案3：橙色下划线+加粗 */
.h2-v3{font-size:20px;font-weight:800;color:#1a1a2e;padding-bottom:6px;border-bottom:3px solid #ff9800;display:inline-block;margin:0 0 12px}

p{font-size:14px;line-height:1.8;color:#444;margin:6px 0}
.step{background:#fafbfc;border:1px solid #e8ecf1;border-radius:6px;padding:12px 16px;margin-top:10px}
</style></head><body>

<h3>方案1：蓝色左边条 + 加粗大字（无白底）</h3>
<div class="option">
  <div class="h2-v1">单ASIN批量打包</div>
  <p>适用于单个ASIN的图片上传Amazon后台。</p>
  <div class="step">步骤1：上传图片</div>
</div>

<h3>方案2：深蓝填充背景白字</h3>
<div class="option">
  <div class="h2-v2">单ASIN批量打包</div>
  <p>适用于单个ASIN的图片上传Amazon后台。</p>
  <div class="step">步骤1：上传图片</div>
</div>

<h3>方案3：橙色下划线 + 加粗</h3>
<div class="option">
  <div class="h2-v3">单ASIN批量打包</div>
  <p>适用于单个ASIN的图片上传Amazon后台。</p>
  <div class="step">步骤1：上传图片</div>
</div>

</body></html>
