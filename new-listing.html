<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>创乐岛-AI工具</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif; background:#f0f2f5; color:#333; }
.header { background:linear-gradient(135deg,#1a3a5c,#2d5a8e); color:#fff; padding:14px 24px; display:flex; align-items:center; gap:12px; }
.header .logo { width:32px; height:32px; background:#4fc3f7; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:16px; }
.header h1 { font-size:16px; font-weight:600; }
.header .sub { font-size:11px; opacity:.7; }
.container { max-width:1200px; margin:16px auto; padding:0 16px; }
.card { background:#fff; border-radius:8px; box-shadow:0 1px 3px rgba(0,0,0,.08); margin-bottom:16px; overflow:hidden; }
.card-head { padding:10px 16px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #f0f0f0; }
.card-head .title { font-weight:600; font-size:14px; }
.card-head .num { display:inline-flex; width:20px; height:20px; background:#1976d2; color:#fff; border-radius:50%; align-items:center; justify-content:center; font-size:11px; margin-right:6px; }
.card-head .hint { font-size:11px; color:#999; }
.card-body { padding:14px 16px; }
.upload-zone { border:2px dashed #bbb; border-radius:8px; padding:24px; text-align:center; cursor:pointer; transition:all .2s; }
.upload-zone:hover { border-color:#1976d2; background:#f5faff; }
.upload-zone .icon { font-size:28px; margin-bottom:4px; }
.upload-zone p { font-size:13px; color:#555; }
.upload-zone .hint { font-size:11px; color:#999; margin-top:2px; }
.params-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:12px; }
.form-group label { display:block; font-size:11px; color:#666; margin-bottom:3px; }
.form-group label .req { color:#e53935; }
.form-group input, .form-group select { width:100%; padding:6px 8px; border:1px solid #ddd; border-radius:5px; font-size:12px; outline:none; }
.btn { padding:8px 20px; border:none; border-radius:5px; font-size:13px; cursor:pointer; font-weight:600; }
.btn-orange { background:#ff9800; color:#fff; }
.btn-blue { background:#1976d2; color:#fff; }
.result-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; flex-wrap:wrap; gap:10px; }
.result-stats { display:flex; gap:16px; font-size:12px; color:#666; }
.result-stats b { color:#1976d2; font-size:14px; }
.table-wrap { overflow:auto; border:1px solid #eee; border-radius:6px; max-height:400px; }
table { width:100%; border-collapse:collapse; font-size:11px; }
th { background:#1a3a5c; color:#fff; padding:6px 8px; text-align:left; white-space:nowrap; font-weight:500; position:sticky; top:0; z-index:10; }
td { padding:6px 8px; border-bottom:1px solid #eee; white-space:nowrap; max-width:180px; overflow:hidden; text-overflow:ellipsis; }
tr:hover td { background:#f8f9fa; }
.tag { padding:1px 6px; border-radius:8px; font-size:10px; }
.tag-p { background:#e3f2fd; color:#1565c0; }
.tag-c { background:#e8f5e9; color:#2e7d32; }
.success-bar { background:#e8f5e9; border-radius:6px; padding:8px 12px; font-size:12px; color:#2e7d32; margin-top:10px; }
.error-bar { background:#ffebee; border-radius:6px; padding:8px 12px; font-size:12px; color:#c62828; margin-top:10px; }
.file-info { background:#f5f7fa; border-radius:6px; padding:8px 12px; margin-top:10px; font-size:12px; display:flex; justify-content:space-between; }
</style>
<style>
@media all {
  body.embed .topbar-bar { display:none !important; }
}

document.getElementById('fileInput').onchange = (e) => { if(e.target.files[0]) handleFile(e.target.files[0]); };

function handleFile(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const wb = XLSX.read(new Uint8Array(e.target.result), {type:'array'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
      
      // 解析公共信息（row3: B3=品牌, E3=售价, H3=父体MSKU）
      const brand = String(rows[2]?.[1] || '').trim();
      const price = String(rows[2]?.[4] || '').trim();
      const parentSku = String(rows[2]?.[7] || '').trim();
      
      if(brand) document.getElementById('brand').value = brand;
      if(price) document.getElementById('price').value = price;
      if(parentSku) document.getElementById('parentSku').value = parentSku;
      
      // 解析数据行（row4=表头, row5=父体, row6+=子体）
      const items = [];
      const errors = [];
      for(let r=4; r<rows.length; r++) {
        const row = rows[r];
        if(!row[1] || !String(row[1]).trim()) continue;
        const isParent = (r===4);
        const item = {
          variantCode: String(row[0]||'').trim(),
          msku: String(row[1]||'').trim(),
          category: String(row[2]||'').trim(),
          title: String(row[3]||'').trim(),
          highlight: String(row[4]||'').trim(),
          bullet1: String(row[5]||'').trim(),
          bullet2: String(row[6]||'').trim(),
          bullet3: String(row[7]||'').trim(),
          bullet4: String(row[8]||'').trim(),
          bullet5: String(row[9]||'').trim(),
          description: String(row[10]||'').trim(),
          st: String(row[11]||'').trim(),
          color: String(row[12]||'').trim(),
          material: String(row[13]||'').trim(),
          quantity: String(row[14]||'').trim(),
          pkgL: String(row[15]||'').trim(),
          pkgW: String(row[16]||'').trim(),
          pkgH: String(row[17]||'').trim(),
          pkgWt: String(row[18]||'').trim(),
          isParent
        };
        // 校验：子体行高亮和材质必填
        if(!isParent) {
          if(!item.highlight) errors.push(`子体 ${item.msku} 缺少「亮点/Title Differentiation」`);
          if(!item.material) errors.push(`子体 ${item.msku} 缺少「材质」`);
        }
        items.push(item);
      }
      
      if(errors.length > 0) {
        document.getElementById('fileInfo').innerHTML = 
          `<div class="error-bar">❌ 校验失败：<br>${errors.join('<br>')}<br>请补全后重新上传</div>`;
        return;
      }
      
      parsedData = items;
      
      document.getElementById('fileInfo').innerHTML = 
        `<div class="file-info"><span>✅ 已识别：${items.length} 行（${items.filter(i=>i.isParent).length}父体 + ${items.filter(i=>!i.isParent).length}子体）</span></div>`;
    } catch(err) {
      document.getElementById('fileInfo').innerHTML = `<div class="error-bar">❌ 解析失败：${err.message}</div>`;
    }
  };
  reader.readAsArrayBuffer(file);
}

function applyToTemplate() {
  const brand = document.getElementById('brand').value.trim();
  const price = document.getElementById('price').value;
  const parentSku = document.getElementById('parentSku').value.trim();
  const pt = document.getElementById('ptSelect').value;
  const headers = ["变体编码","MSKU","产品类目","标题(Product Name)","亮点/Title Differentiation","五点1","五点2","五点3","五点4","五点5","产品描述","Search Terms(ST)","颜色/主题","材质","数量(件)","包装长(inch)","包装宽(inch)","包装高(inch)","包装重(lb)"];
  const data = [
    ['新品文案编写表'],
    ['填写说明：父体行只填公共信息（黄色行），子体行每行一个变体。留空的字段自动取工具表单中的默认值。'],
    ['品牌名', brand, '', '售价(USD)', price, '', '父体MSKU', parentSku],
    headers,
    ['（父体）', parentSku, pt, ''],
  ];
  for(let i=0;i<10;i++) data.push(new Array(19).fill(''));
  const ws = XLSX.utils.aoa_to_sheet(data);
  ws['!cols'] = [{wch:10},{wch:22},{wch:18},{wch:40},{wch:30},{wch:25},{wch:25},{wch:25},{wch:25},{wch:25},{wch:35},{wch:30},{wch:14},{wch:14},{wch:10},{wch:12},{wch:12},{wch:12},{wch:12}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '文案编写');
  XLSX.writeFile(wb, '新品文案编写表-'+parentSku+'.xlsx');
}

function generate() {
  if(!parsedData) { alert('请先上传文案表'); return; }
  const pt = document.getElementById('ptSelect').value;
  const brand = document.getElementById('brand').value.trim();
  const price = parseFloat(document.getElementById('price').value) || 0;
  const parentSku = document.getElementById('parentSku').value.trim();
  const vTheme = document.getElementById('vTheme').value;
  const material = document.getElementById('material').value.trim();
  const pkgL = document.getElementById('pkgL').value;
  const pkgW = document.getElementById('pkgW').value;
  const pkgH = document.getElementById('pkgH').value;
  const pkgWt = document.getElementById('pkgWt').value;
  
  if(!pt || !brand || !price || !parentSku) { alert('请填写必填项：product_type、品牌、售价、父体MSKU'); return; }
  
  // Decode template
  const tplBytes = Uint8Array.from(atob(TEMPLATE_B64), c => c.charCodeAt(0));
  const wb = XLSX.read(tplBytes, {type:'array'});
  const ws = wb.Sheets['Template'];
  const aoa = XLSX.utils.sheet_to_json(ws, {header:1, defval:'', raw:false});
  
  // Row 5 (index 4) = system names, build column map
  const sysRow = aoa[4] || [];
  const colMap = {};
  for(let i=0; i<sysRow.length; i++) {
    const sn = String(sysRow[i]||'');
    if(!colMap['record_action'] && sn.includes('record_action')) colMap['record_action']=i;
    if(!colMap['parentage'] && sn.includes('parentage_level')) colMap['parentage']=i;
    if(!colMap['child_parent_sku'] && sn.includes('parent_sku')) colMap['child_parent_sku']=i;
    if(!colMap['variation_theme'] && sn.includes('variation_theme')) colMap['variation_theme']=i;
    if(!colMap['item_name'] && sn.startsWith('item_name[')) colMap['item_name']=i;
    if(!colMap['title_diff'] && sn.includes('title_differentiation')) colMap['title_diff']=i;
    if(!colMap['brand'] && sn.startsWith('brand[')) colMap['brand']=i;
    if(!colMap['product_type'] && sn.includes('product_type')) colMap['product_type']=i;
    if(!colMap['product_id_type'] && sn.includes('product_id_type')) colMap['product_id_type']=i;
    if(!colMap['model_number'] && sn.includes('model_number')) colMap['model_number']=i;
    if(!colMap['manufacturer'] && sn.startsWith('manufacturer[')) colMap['manufacturer']=i;
    if(!colMap['bullets']) colMap['bullets']=[];
    if(sn.includes('bullet_point') && sn.includes('.value')) colMap['bullets'].push(i);
    if(!colMap['description'] && sn.includes('product_description')) colMap['description']=i;
    if(!colMap['generic_keyword'] && sn.includes('generic_keyword')) colMap['generic_keyword']=i;
    if(!colMap['color'] && sn.startsWith('color[') && sn.includes('.value')) colMap['color']=i;
    if(!colMap['material'] && sn.startsWith('material[') && sn.includes('.value')) colMap['material']=i;
    if(!colMap['num_items'] && sn.includes('number_of_items')) colMap['num_items']=i;
    if(!colMap['condition'] && sn.includes('condition_type')) colMap['condition']=i;
    if(!colMap['list_price'] && sn.includes('list_price')) colMap['list_price']=i;
    if(!colMap['our_price'] && sn.includes('our_price') && sn.includes('value_with_tax')) colMap['our_price']=i;
    if(!colMap['item_length'] && sn.includes('item_length')) colMap['item_length']=i;
    if(!colMap['item_width'] && sn.includes('item_width')) colMap['item_width']=i;
    if(!colMap['item_weight'] && sn.includes('item_weight')) colMap['item_weight']=i;
    if(!colMap['pkg_height'] && sn.includes('item_package_dimensions') && sn.includes('height')) colMap['pkg_height']=i;
    if(!colMap['country_origin'] && sn.includes('country_of_origin')) colMap['country_origin']=i;
    if(!colMap['fulfillment'] && sn.includes('fulfillment_channel_code')) colMap['fulfillment']=i;
    if(!colMap['status'] && sn.includes('listing_status')) colMap['status']=i;
    if(!colMap['title'] && sn === '::title') colMap['title']=i;
    if(!colMap['sku'] && sn.includes('contribution_sku')) colMap['sku']=i;
  }
  
  // Data starts at row 7 (index 6)
  // Clear any existing sample data rows (row 6 onwards)
  while(aoa.length > 5) aoa.pop();
  
  parsedData.forEach(item => {
    const isParent = item.isParent;
    const row = new Array(aoa[4].length).fill('');
    
    row[colMap['status']] = 'Update';
    row[colMap['title']] = item.title;
    row[colMap['sku']] = item.msku;
    row[colMap['product_type']] = pt;
    row[colMap['record_action']] = 'Create or Replace';
    row[colMap['parentage']] = isParent ? 'parent' : 'child';
    row[colMap['child_parent_sku']] = isParent ? '' : parentSku;
    row[colMap['variation_theme']] = isParent ? vTheme : '';
    row[colMap['item_name']] = isParent ? '' : item.title;
    row[colMap['title_diff']] = isParent ? '' : item.highlight;
    row[colMap['brand']] = brand;
    row[colMap['product_id_type']] = isParent ? '' : 'GTIN_EXEMPT';
    row[colMap['model_number']] = isParent ? '' : item.msku;
    row[colMap['manufacturer']] = brand;
    
    if(!isParent) {
      const bullets = [item.bullet1, item.bullet2, item.bullet3, item.bullet4, item.bullet5];
      colMap['bullets'].forEach((idx, i) => { row[idx] = bullets[i] || ''; });
      row[colMap['description']] = item.description;
      row[colMap['generic_keyword']] = item.st;
      row[colMap['color']] = item.color;
      row[colMap['material']] = item.material || material;
      row[colMap['num_items']] = item.quantity || '1';
      row[colMap['condition']] = 'New';
      row[colMap['list_price']] = price.toFixed(2);
      row[colMap['our_price']] = price.toFixed(2);
      row[colMap['item_length']] = pkgL;
      row[colMap['item_width']] = pkgW;
      row[colMap['pkg_height']] = pkgH;
      row[colMap['item_weight']] = pkgWt;
      row[colMap['country_origin']] = 'CN';
      row[colMap['fulfillment']] = 'DEFAULT';
    }
    
    aoa.push(row);
  });
  
  // Show preview
  document.getElementById('resultCard').style.display = 'block';
  document.getElementById('resultStats').innerHTML = 
    `<span><b>${parsedData.length}</b> 行（1父体+${parsedData.length-1}子体）</span><span><b>${aoa[4].length}</b> 列</span>`;
  
  let tableHtml = '<table><thead><tr>';
  const dispRow = aoa[3] || [];
  dispRow.slice(0,15).forEach(h => tableHtml += `<th>${h||''}</th>`);
  tableHtml += '</tr></thead><tbody>';
  aoa.slice(5,9).forEach((row,i) => {
    tableHtml += '<tr>';
    row.slice(0,15).forEach((cell,j) => {
      if(j===0) tableHtml += `<td><span class="tag ${i===0?'tag-p':'tag-c'}">${i===0?'父':'子'}</span></td>`;
      tableHtml += `<td title="${cell}">${cell}</td>`;
    });
    tableHtml += '</tr>';
  });
  tableHtml += '</tbody></table>';
  document.getElementById('previewTable').innerHTML = tableHtml;
  document.getElementById('resultMsg').innerHTML = '<div class="success-bar">✅ 生成完成，点击下载按钮获取库存文件</div>';
  
  window._wb = wb;
  window._aoa = aoa;
}

function download() {
  if(!window._wb || !window._aoa) return;
  const ws = XLSX.utils.aoa_to_sheet(window._aoa);
  window._wb.Sheets['Template'] = ws;
  window._wb.SheetNames = ['Template'];
  XLSX.writeFile(window._wb, 'Amazon_FlatFile_'+new Date().toISOString().slice(0,10)+'.xlsx');
}

</script>
<script>
if(window.self !== window.top){
  document.addEventListener('DOMContentLoaded', function(){
    var h = document.querySelector('.header') || document.querySelector('header') || document.querySelector('h1');
    if(h) h.style.display='none';
    // Also hide any back/home link
    document.querySelectorAll('a[href="CreativeIsland.html"], a[href="index.html"], a[href="./"]').forEach(function(a){a.style.display='none';});
  });
}
</script></body>
