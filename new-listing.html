<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新品上架工具</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif; background:#f0f2f5; color:#333; }
.header { background:linear-gradient(135deg,#1a3a5c,#2d5a8e); color:#fff; padding:14px 24px; display:flex; align-items:center; gap:12px; }
.header .logo { width:32px; height:32px; background:#4fc3f7; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:16px; }
.header h1 { font-size:16px; font-weight:600; }
.header .sub { font-size:11px; opacity:.7; }
.container { max-width:1200px; margin:16px auto; padding:0 16px; }
.card { background:#fff; border-radius:8px; box-shadow:0 1px 3px rgba(0,0,0,.08); margin-bottom:16px; overflow:hidden; }
.card-head { padding:10px 16px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #f0f0f0; }
.card-head .title { font-weight:600; font-size:14px; }
.card-head .num { display:inline-flex; width:20px; height:20px; background:#1976d2; color:#fff; border-radius:50%; align-items:center; justify-content:center; font-size:11px; margin-right:6px; }
.card-head .hint { font-size:11px; color:#999; }
.card-body { padding:14px 16px; }
.upload-zone { border:2px dashed #bbb; border-radius:8px; padding:24px; text-align:center; cursor:pointer; transition:all .2s; }
.upload-zone:hover { border-color:#1976d2; background:#f5faff; }
.upload-zone .icon { font-size:28px; margin-bottom:4px; }
.upload-zone p { font-size:13px; color:#555; }
.upload-zone .hint { font-size:11px; color:#999; margin-top:2px; }
.params-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:12px; }
.form-group label { display:block; font-size:11px; color:#666; margin-bottom:3px; }
.form-group label .req { color:#e53935; }
.form-group input, .form-group select { width:100%; padding:6px 8px; border:1px solid #ddd; border-radius:5px; font-size:12px; outline:none; }
.btn { padding:8px 20px; border:none; border-radius:5px; font-size:13px; cursor:pointer; font-weight:600; }
.btn-orange { background:#ff9800; color:#fff; }
.btn-blue { background:#1976d2; color:#fff; }
.result-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; flex-wrap:wrap; gap:10px; }
.result-stats { display:flex; gap:16px; font-size:12px; color:#666; }
.result-stats b { color:#1976d2; font-size:14px; }
.table-wrap { overflow:auto; border:1px solid #eee; border-radius:6px; max-height:400px; }
table { width:100%; border-collapse:collapse; font-size:11px; }
th { background:#1a3a5c; color:#fff; padding:6px 8px; text-align:left; white-space:nowrap; font-weight:500; position:sticky; top:0; z-index:10; }
td { padding:6px 8px; border-bottom:1px solid #eee; white-space:nowrap; max-width:180px; overflow:hidden; text-overflow:ellipsis; }
tr:hover td { background:#f8f9fa; }
.tag { padding:1px 6px; border-radius:8px; font-size:10px; }
.tag-p { background:#e3f2fd; color:#1565c0; }
.tag-c { background:#e8f5e9; color:#2e7d32; }
.success-bar { background:#e8f5e9; border-radius:6px; padding:8px 12px; font-size:12px; color:#2e7d32; margin-top:10px; }
.error-bar { background:#ffebee; border-radius:6px; padding:8px 12px; font-size:12px; color:#c62828; margin-top:10px; }
.file-info { background:#f5f7fa; border-radius:6px; padding:8px 12px; margin-top:10px; font-size:12px; display:flex; justify-content:space-between; }
</style>
</head>
<body>
<div class="header">
  <div class="logo">📦</div>
  <div><h1>新品上架工具</h1><div class="sub">上传文案表 → 自动生成亚马逊库存文件</div></div>
</div>
<div class="container">

  <div class="card">
    <div class="card-head">
      <div class="title"><span class="num">1</span>上传文案编写表 + 公共参数</div>
      <div style="display:flex;gap:10px;align-items:center;">
        <span style="font-size:11px;color:#999;">支持 .xlsx</span>
        <button class="btn" style="background:#fff;border:1px solid #ddd;color:#333;padding:5px 12px;font-size:12px;" onclick="downloadTemplate()">📥 下载填写模板</button>
      </div>
    </div>
    <div class="card-body">
      <div class="upload-zone" id="uploadZone">
        <div class="icon">📄</div>
        <p>拖拽文件到这里，或 <b>点击选择文件</b></p>
        <div class="hint">使用「新品文案编写表-模板.xlsx」格式</div>
        <input type="file" id="fileInput" accept=".xlsx" style="display:none">
      </div>
      <div id="fileInfo"></div>

      <div class="params-grid">
        <div class="form-group"><label>product_type（类目）<span class="req">*</span></label><select id="ptSelect"></select></div>
        <div class="form-group"><label>品牌名 <span class="req">*</span></label><input id="brand"></div>
        <div class="form-group"><label>售价(USD) <span class="req">*</span></label><input id="price" type="number" step="0.01"></div>
        <div class="form-group"><label>父体MSKU <span class="req">*</span></label><input id="parentSku"></div>
        <div class="form-group"><label>变体主题</label><select id="vTheme"><option>COLOR</option><option>SIZE</option><option>CAPACITY</option><option>PATTERN</option><option>THEME</option><option>SET_NAME</option><option>NUMBER_OF_ITEMS</option><option>无变体</option></select></div>
        <div class="form-group"><label>材质（选填）</label><input id="material"></div>
        <div class="form-group"><label>包装长(in) <span class="req">*</span></label><input id="pkgL" type="number" step="0.01"></div>
        <div class="form-group"><label>包装宽(in) <span class="req">*</span></label><input id="pkgW" type="number" step="0.01"></div>
        <div class="form-group"><label>包装高(in) <span class="req">*</span></label><input id="pkgH" type="number" step="0.01"></div>
        <div class="form-group"><label>包装重量(lb) <span class="req">*</span></label><input id="pkgWt" type="number" step="0.01"></div>
      </div>
      <div style="margin-top:14px; display:flex; justify-content:space-between; align-items:center;">
        <div style="display:flex;gap:10px;">
          <button class="btn btn-orange" style="padding:9px 40px;" onclick="generate()">生成上传模板</button>
          <button class="btn" style="padding:9px 20px;background:#fff;border:1px solid #ddd;color:#333;" onclick="applyToTemplate()">应用至表格</button>
        </div>
        <span style="font-size:12px;color:#1976d2;cursor:pointer;text-decoration:underline;" onclick="loadSample()">没有文件？载入示例数据试试</span>
      </div>
    </div>
  </div>

  <div class="card" id="resultCard" style="display:none">
    <div class="card-head">
      <div class="title"><span class="num">2</span>生成结果</div>
      <div class="hint">预览无误后下载，上传至亚马逊后台</div>
    </div>
    <div class="card-body">
      <div class="result-bar">
        <div class="result-stats" id="resultStats"></div>
        <button class="btn btn-blue" onclick="download()">📥 下载库存文件.xlsx</button>
      </div>
      <div class="table-wrap" id="previewTable"></div>
      <div id="resultMsg"></div>
    </div>
  </div>

</div>

<script>
const PT_LIST = ["ADULT_COSTUME","ADVENT_CALENDAR","ANCHOR_STAKE","ANIMAL_COLLAR","APPAREL","APPAREL_BELT","APPAREL_HEAD_NECK_COVERING","APPAREL_PIN","APRON","AREA_DEODORIZER","ARTIFICIAL_PLANT","ART_CRAFT_KIT","ART_SUPPLIES","AUTO_ACCESSORY","BABY_PRODUCT","BACKDROP","BADGE_HOLDER","BALLOON","BANNER","BARBECUE_TOOL_SET","BEAUTY","BEVERAGE_INSULATOR","BLANKET","BLANK_BOOK","BONDING_ADHESIVES","BOOKMARK","BOOK_COVER","BOOK_DOCUMENT_STAND","BRACELET","BUCKLE","CADDY","CAKE_TOPPER","CARD_STOCK","CELL_PHONE_GRIP","CHARM","CHILDRENS_COSTUME","CLIMBING_PLANT_SUPPORT_STRUCTURE","COFFEE_MAKER","COMPUTER_ADD_ON","CONFETTI","COOKIE_CUTTER","COSMETIC_CASE","COSTUME_EYEWEAR","COSTUME_HEADWEAR","COSTUME_MASK","COSTUME_OUTFIT","CUFF_LINK","CURTAIN","CURTAIN_FASTENER","CURTAIN_SWAG_HOLDER","DECORATIVE_CUTOUT","DECORATIVE_MAGNET","DECORATIVE_PILLOW_COVER","DECORATIVE_POM_POM","DECORATIVE_RIBBON_TRIM","DECORATIVE_SIGNAGE","DISHWARE_BOWL","DISHWARE_PLACE_SETTING","DISHWARE_PLATE","DISHWASHER","DISPOSABLE_NAPKIN","DRINKING_CUP","DRINK_COASTER","EARRING","ELECTRIC_FAN","ELECTRIC_LANTERN","ENVELOPE","FABRIC_APPLIQUE_PATCH","FIGURINE","FLASH_CARD","FOOD_STORAGE_BAG","GARLAND","GIFT_WRAP","GREETING_CARD","HAIRBAND","HAIR_CLIP","HANGING_ORNAMENT","HEALTH_PERSONAL_CARE","HOME","HOME_MIRROR","ICE_CHEST","IRON_ON_TRANSFER_DESIGN","JAR","JEWELRY","JEWELRY_SET","JEWELRY_STORAGE","KEYCHAIN","KITCHEN","LABEL","LAMP","LIGHT_FIXTURE","MAILBOX","MINIATURE_TOY_FURNISHING","NAPKIN_RING","NECKLACE","NECKTIE","OFFICE_PRODUCTS","OUTDOOR_LIVING","PAPER_TOWEL","PAPER_TOWEL_HOLDER","PARTY_DECORATION_PACK","PARTY_FAVOR","PARTY_SUPPLIES","PET_APPAREL","PET_PLACEMAT","PET_SUPPLIES","PIERCING_JEWELRY","PINATA","PINBOARD","PLACEMAT","PORTABLE_ELECTRONIC_DEVICE_COVER","PORTABLE_ELECTRONIC_DEVICE_STAND","POTPOURRI_SACHET","POT_HOLDER","RING","RUG","SCARF","SCULPTURE","SELF_STICK_NOTE","SEWING_BUTTON","SEWING_PATTERN","SHARP_PIN","SHELF","SKIRT","SOCKS","SPORTING_GOODS","STICKER_DECAL","STORAGE_HOOK","TABLECLOTH","TABLETOP_GAME","TABLE_RUNNER","TEMPORARY_TATTOO","TOTE_BAG","TOWEL","TOYS_AND_GAMES","TOY_FIGURE","TRAY","TREE_SKIRT","VEHICLE_MIRROR","WALL_ART","WIG","WIND_CHIME","WIND_SPINNER","WREATH","WRITING_INSTRUMENT","WRITING_PAPER","TOY_BUILDING_BLOCK","ACCESSORY"];
const sel = document.getElementById('ptSelect');
PT_LIST.forEach(pt => { const o=document.createElement('option'); o.value=pt; o.textContent=pt; sel.appendChild(o); });

let parsedData = null;

document.getElementById('uploadZone').onclick = () => document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange = (e) => { if(e.target.files[0]) handleFile(e.target.files[0]); };

function handleFile(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const wb = XLSX.read(new Uint8Array(e.target.result), {type:'array'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
      
      // 解析公共信息
      const brand = String(rows[1]?.[1] || '').trim();
      const price = String(rows[1]?.[4] || '').trim();
      const parentSku = String(rows[2]?.[1] || '').trim();
      
      if(brand) document.getElementById('brand').value = brand;
      if(price) document.getElementById('price').value = price;
      if(parentSku) document.getElementById('parentSku').value = parentSku;
      
      // 解析数据行（row4=表头, row5=父体, row6+=子体）
      const headerRow = rows[3];
      const items = [];
      for(let r=4; r<rows.length; r++) {
        const row = rows[r];
        if(!row[1] || !String(row[1]).trim()) continue;
        items.push({
          variantCode: String(row[0]||'').trim(),
          msku: String(row[1]||'').trim(),
          category: String(row[2]||'').trim(),
          title: String(row[3]||'').trim(),
          highlight: String(row[4]||'').trim(),
          bullet1: String(row[5]||'').trim(),
          bullet2: String(row[6]||'').trim(),
          bullet3: String(row[7]||'').trim(),
          bullet4: String(row[8]||'').trim(),
          bullet5: String(row[9]||'').trim(),
          description: String(row[10]||'').trim(),
          st: String(row[11]||'').trim(),
          color: String(row[12]||'').trim(),
          material: String(row[13]||'').trim(),
          quantity: String(row[14]||'').trim(),
          isParent: r===4
        });
      }
      parsedData = items;
      
      document.getElementById('fileInfo').innerHTML = 
        `<div class="file-info"><span>✅ 已识别：${items.length} 行（${items.filter(i=>i.isParent).length}父体 + ${items.filter(i=>!i.isParent).length}子体）</span></div>`;
    } catch(err) {
      document.getElementById('fileInfo').innerHTML = `<div class="error-bar">❌ 解析失败：${err.message}</div>`;
    }
  };
  reader.readAsArrayBuffer(file);
}

function applyToTemplate() {
  const brand = document.getElementById('brand').value.trim();
  const price = document.getElementById('price').value;
  const parentSku = document.getElementById('parentSku').value.trim();
  const pt = document.getElementById('ptSelect').value;
  const headers = ["变体编码","MSKU","产品类目","标题(Product Name)","亮点/Title Differentiation","五点1","五点2","五点3","五点4","五点5","产品描述","Search Terms(ST)","颜色/主题","材质","数量(件)"];
  const data = [
    ['品牌名：'+brand, '', '', '售价(USD)：'+price],
    ['父体MSKU：'+parentSku],
    headers,
    ['-', parentSku, pt, ''],
  ];
  for(let i=0;i<10;i++) data.push(['','','','','','','','','','','','','','','']);
  const ws = XLSX.utils.aoa_to_sheet(data);
  ws['!cols'] = [{wch:12},{wch:22},{wch:18},{wch:40},{wch:25},{wch:25},{wch:25},{wch:25},{wch:25},{wch:25},{wch:40},{wch:25},{wch:15},{wch:14},{wch:8}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '文案编写');
  XLSX.writeFile(wb, '新品文案编写表-'+parentSku+'.xlsx');
}

  for(let i=0; i<byteChars.length; i++) bytes[i] = byteChars.charCodeAt(i);
  const blob = new Blob([bytes], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '新品文案编写表-模板.xlsx';
  a.click();
  URL.revokeObjectURL(url);
}

function generate() {
  if(!parsedData) { alert('请先上传文案表'); return; }
  const pt = document.getElementById('ptSelect').value;
  const brand = document.getElementById('brand').value.trim();
  const price = parseFloat(document.getElementById('price').value) || 0;
  const parentSku = document.getElementById('parentSku').value.trim();
  const vTheme = document.getElementById('vTheme').value;
  const material = document.getElementById('material').value.trim();
  const pkgL = document.getElementById('pkgL').value;
  const pkgW = document.getElementById('pkgW').value;
  const pkgH = document.getElementById('pkgH').value;
  const pkgWt = document.getElementById('pkgWt').value;
  
  if(!pt || !brand || !price || !parentSku) { alert('请填写必填项：product_type、品牌、售价、父体MSKU'); return; }
  
  // 构建输出行
  const headers = [
    'contribution_sku','product_type','::record_action','parentage',
    'child_parent_sku','variation_theme','item_name','title_differentiation',
    'brand','product_id_type','item_type_keyword','manufacturer',
    'bullet_point#1','bullet_point#2','bullet_point#3','bullet_point#4','bullet_point#5',
    'product_description','generic_keyword','color','size','material',
    'number_of_items','part_number','model_number','model_name',
    'condition_type','list_price','our_price',
    'package_length','package_width','package_height','package_weight',
    'fulfillment_channel','country_of_origin','batteries_required'
  ];
  
  const outRows = [headers];
  
  parsedData.forEach(item => {
    const isParent = item.isParent;
    const row = {
      'contribution_sku': item.msku,
      'product_type': pt,
      '::record_action': 'Create or Replace (Full Update)',
      'parentage': isParent ? 'Parent' : 'Child',
      'child_parent_sku': isParent ? '' : parentSku,
      'variation_theme': isParent ? vTheme : '',
      'item_name': item.title,
      'title_differentiation': isParent ? '' : item.highlight,
      'brand': brand,
      'product_id_type': isParent ? '' : 'GTIN Exempt',
      'item_type_keyword': '',
      'manufacturer': brand,
      'bullet_point#1': isParent ? '' : item.bullet1,
      'bullet_point#2': isParent ? '' : item.bullet2,
      'bullet_point#3': isParent ? '' : item.bullet3,
      'bullet_point#4': isParent ? '' : item.bullet4,
      'bullet_point#5': isParent ? '' : item.bullet5,
      'product_description': isParent ? '' : item.description,
      'generic_keyword': isParent ? '' : item.st,
      'color': isParent ? '' : item.color,
      'size': isParent ? '' : 'OSFA',
      'material': isParent ? '' : (item.material || material),
      'number_of_items': isParent ? '' : (item.quantity || '1'),
      'part_number': isParent ? '' : item.msku,
      'model_number': isParent ? '' : item.msku,
      'model_name': isParent ? '' : '',
      'condition_type': isParent ? '' : 'New',
      'list_price': isParent ? '' : price.toFixed(2),
      'our_price': isParent ? '' : price.toFixed(2),
      'package_length': isParent ? '' : pkgL,
      'package_width': isParent ? '' : pkgW,
      'package_height': isParent ? '' : pkgH,
      'package_weight': isParent ? '' : pkgWt,
      'fulfillment_channel': isParent ? '' : 'AMZ_FBA',
      'country_of_origin': isParent ? '' : 'CN',
      'batteries_required': isParent ? '' : 'No'
    };
    outRows.push(headers.map(h => row[h]));
  });
  
  // 渲染预览
  document.getElementById('resultCard').style.display = 'block';
  document.getElementById('resultStats').innerHTML = 
    `<span><b>${parsedData.length}</b> 行（1父体+${parsedData.length-1}子体）</span><span><b>${headers.length}</b> 字段</span>`;
  
  let tableHtml = '<table><thead><tr>';
  headers.slice(0,15).forEach(h => tableHtml += `<th>${h}</th>`);
  tableHtml += '</tr></thead><tbody>';
  outRows.slice(0,4).forEach((row,i) => {
    tableHtml += '<tr>';
    row.slice(0,15).forEach((cell,j) => {
      if(j===0) tableHtml += `<td><span class="tag ${i===0?'tag-p':'tag-c'}">${i===0?'父':'子'}</span></td>`;
      tableHtml += `<td title="${cell}">${cell}</td>`;
    });
    tableHtml += '</tr>';
  });
  tableHtml += '</tbody></table>';
  document.getElementById('previewTable').innerHTML = tableHtml;
  document.getElementById('resultMsg').innerHTML = '<div class="success-bar">✅ 生成完成，点击下载按钮获取库存文件</div>';
  
  // 保存数据供下载
  window._outRows = outRows;
}

function download() {
  if(!window._outRows) return;
  const ws = XLSX.utils.aoa_to_sheet(window._outRows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Template');
  XLSX.writeFile(wb, 'Amazon_Inventory_File.xlsx');
}
